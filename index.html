<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Game Room</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
    <!-- Modern automated Ruffle loader -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- This custom tag tells Ruffle exactly what file to run automatically -->
    <ruffle-player swf="Fireboy and Watergirl in The Forest Temple.swf"></ruffle-player>

</body>
</html>
