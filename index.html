<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Game Room</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        embed { width: 100%; height: 100%; display: block; border: none; }
    </style>
    <!-- Ruffle script intercepts standard Flash embed tags -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- A traditional Flash embed tag that Ruffle will automatically replace -->
    <embed src="Fireboy and Watergirl in the Forest Temple.swf" type="application/x-shockwave-flash"></embed>

</body>
</html>
