<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Game Room</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #player { width: 100%; height: 100%; }
    </style>
    <!-- Load Updated Ruffle Emulator Script -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="player"></div>
    <script>
        // The modernized, safer way to initialize Ruffle
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden"
        };
        
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.ruffle;
            if (ruffle) {
                const player = ruffle.createPlayer();
                const container = document.getElementById("player");
                container.appendChild(player);
                // MAKE SURE THIS MATCHES YOUR FILENAME EXACTLY (CASE SENSITIVE)
                player.load("run3.swf"); 
            } else {
                console.error("Ruffle failed to initialize properly.");
            }
        });
    </script>
</body>
</html>
